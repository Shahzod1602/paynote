services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paynote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: paynote
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paynote -d paynote"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://paynote:${POSTGRES_PASSWORD}@db:5432/paynote?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      IDENTIFY_SMS_API_KEY: ${IDENTIFY_SMS_API_KEY}
      IDENTIFY_SMS_SIM: ${IDENTIFY_SMS_SIM:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:-}
      TELEGRAM_GATEWAY_TOKEN: ${TELEGRAM_GATEWAY_TOKEN:-}
    # Faqat localhost:3008 -> container 3000. Tashqi kirish nginx (paynote.identify.uz, 443) orqali.
    ports:
      - "127.0.0.1:3008:3000"

  # Kunlik off-site DB backup -> storage.identify.uz (storagedb Storage API).
  # STORAGE_* sozlanmagan bo'lsa, backup.sh shunchaki SKIP qiladi (boshqa servislarga ta'sir yo'q).
  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: paynote
      POSTGRES_USER: paynote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_API_URL: ${STORAGE_API_URL:-}
      STORAGE_SERVICE_KEY: ${STORAGE_SERVICE_KEY:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-paynote-backups}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}

volumes:
  pgdata:
